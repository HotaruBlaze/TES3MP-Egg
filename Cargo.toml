[package]
name = "tes3mp-runner"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "tes3mp-runner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread","macros","process","sync","time","signal","io-util"]}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
ansiterm = "0.12.2"
anyhow = "1"
once_cell = "1"
is-terminal = "0.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"